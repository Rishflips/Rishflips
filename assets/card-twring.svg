<svg xmlns="http://www.w3.org/2000/svg" width="430" height="210" viewBox="0 0 430 210" role="img" aria-label="Twring: Call your agents. Let them call you.">
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ee787"/><stop offset="1" stop-color="#7ee787" stop-opacity="0"/></linearGradient></defs>
  <rect x="1" y="1" width="428" height="208" rx="16" fill="url(#b)" stroke="#30363d"/>
  <rect x="1" y="1" width="428" height="4" rx="2" fill="url(#edge)"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></rect>
  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="28" y="56" font-size="30" font-weight="800" fill="#f0f6fc">Twring</text>
    <circle cx="142" cy="46" r="5" fill="#7ee787"><animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="154" y="51" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#7ee787">live beta</text>
    <text x="28" y="84" font-size="16" font-weight="600" fill="#7ee787">Call your agents. Let them call you.</text>
    <text x="28" y="118" font-size="15" fill="#c9d1d9">A live voice line for the AI agents you already run.</text><text x="28" y="142" font-size="15" fill="#c9d1d9">Hermes, Claude Code, Codex, Gemini CLI. They ring</text><text x="28" y="166" font-size="15" fill="#c9d1d9">you when a job is done or needs your OK.</text>
  </g>
</svg>