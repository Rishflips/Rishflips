<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="What I am doing right now">
  <rect x="1" y="1" width="898" height="268" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="898" height="36" rx="14" fill="#161b22"/><rect x="1" y="24" width="898" height="13" fill="#161b22"/>
  <circle cx="26" cy="19" r="6" fill="#ff5f56"/><circle cx="46" cy="19" r="6" fill="#ffbd2e"/><circle cx="66" cy="19" r="6" fill="#27c93f"/>
  <text x="450" y="24" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">rish@saasage: ~/now</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">
    <text x="28" y="72" fill="#7ee787" >$ cat now.txt<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" dur="0.7s" fill="freeze"/></text>
    <text x="28" y="100" fill="#e6edf3" ><tspan fill="#a78bfa">shipping</tspan><tspan x="150">Twring beta, so agents can call me back</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.75;1" dur="1.2s" fill="freeze"/></text>
    <text x="28" y="128" fill="#e6edf3" ><tspan fill="#a78bfa">building</tspan><tspan x="150">BiBrain, a second brain my agents keep honest</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.824;1" dur="1.7s" fill="freeze"/></text>
    <text x="28" y="156" fill="#e6edf3" ><tspan fill="#a78bfa">teammates</tspan><tspan x="150">one human, a few AI agents, zero meetings</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.864;1" dur="2.1999999999999997s" fill="freeze"/></text>
    <text x="28" y="184" fill="#e6edf3" ><tspan fill="#a78bfa">stack</tspan><tspan x="150">TypeScript, Python, Hermes, MCP, too much coffee</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.889;1" dur="2.6999999999999997s" fill="freeze"/></text>
    <text x="28" y="212" fill="#e6edf3" ><tspan fill="#a78bfa">rule</tspan><tspan x="150">ship it, watch it break, fix it, write it down</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.906;1" dur="3.1999999999999997s" fill="freeze"/></text>
    <text x="28" y="248" fill="#7ee787" >$<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.923;1" dur="3.9s" fill="freeze"/></text>
    <rect x="44" y="234" width="10" height="18" fill="#7ee787" ><animate attributeName="opacity" values="0;1;0" begin="3.6s" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</svg>