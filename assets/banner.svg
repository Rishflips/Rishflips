<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Rish. Solo founder shipping AI products in public.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#140b24"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787">
        <animate attributeName="stop-color" values="#7ee787;#a78bfa;#f778ba;#7ee787" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f778ba;#7ee787;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="900" height="240" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <circle cx="760" cy="60" r="160" fill="url(#glow)">
      <animate attributeName="cx" values="760;690;760" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="230" r="140" fill="url(#glow)" opacity="0.6">
      <animate attributeName="cy" values="230;190;230" dur="10s" repeatCount="indefinite"/>
    </circle>
    <!-- drifting dots -->
    <g fill="#ffffff" opacity="0.5">
      <circle cx="610" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="150" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="200" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="210" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="30" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <text x="56" y="108" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#ink)" letter-spacing="-1">Rish</text>
  <text x="58" y="142" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#8b949e">solo founder · SaaSage Labs · india</text>

  <!-- rotating lines, each typed in with a cursor -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#e6edf3">
    <text x="58" y="190" fill="#7ee787">&gt;</text>
    <g>
      <clipPath id="t1"><rect x="80" y="170" height="30" width="500">
        <animate attributeName="width" values="0;500;500;0;0" keyTimes="0;0.12;0.28;0.32;1" dur="12s" repeatCount="indefinite"/>
      </rect></clipPath>
      <text x="80" y="190" clip-path="url(#t1)">vibe coding AI products, alone, in public</text>
    </g>
    <g>
      <clipPath id="t2"><rect x="80" y="170" height="30" width="0">
        <animate attributeName="width" values="0;0;450;450;0;0" keyTimes="0;0.33;0.45;0.61;0.65;1" dur="12s" repeatCount="indefinite"/>
      </rect></clipPath>
      <text x="80" y="190" clip-path="url(#t2)">giving AI agents a phone line: Twring</text>
    </g>
    <g>
      <clipPath id="t3"><rect x="80" y="170" height="30" width="0">
        <animate attributeName="width" values="0;0;475;475;0" keyTimes="0;0.66;0.78;0.96;1" dur="12s" repeatCount="indefinite"/>
      </rect></clipPath>
      <text x="80" y="190" clip-path="url(#t3)">writing down what works and what breaks</text>
    </g>
    <rect x="582" y="174" width="11" height="22" fill="#7ee787">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="x" values="82;582;582;82;82;532;532;82;82;557;557;82" keyTimes="0;0.12;0.28;0.32;0.33;0.45;0.61;0.65;0.66;0.78;0.96;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
