<svg xmlns="http://www.w3.org/2000/svg" width="430" height="210" viewBox="0 0 430 210" role="img" aria-label="BiBrain: A second brain your AI agents keep current.">
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs>
  <rect x="1" y="1" width="428" height="208" rx="16" fill="url(#b)" stroke="#30363d"/>
  <rect x="1" y="1" width="428" height="4" rx="2" fill="url(#edge)"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></rect>
  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="28" y="56" font-size="30" font-weight="800" fill="#f0f6fc">BiBrain</text>
    <circle cx="159" cy="46" r="5" fill="#a78bfa"><animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="171" y="51" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#a78bfa">building</text>
    <text x="28" y="84" font-size="16" font-weight="600" fill="#a78bfa">A second brain your AI agents keep current.</text>
    <text x="28" y="118" font-size="15" fill="#c9d1d9">Local-first. Codex, Claude Code and Cursor recall</text><text x="28" y="142" font-size="15" fill="#c9d1d9">what is true and suggest what changed. Nothing</text><text x="28" y="166" font-size="15" fill="#c9d1d9">becomes fact until you keep it.</text>
  </g>
</svg>